    <main class="gallery-page">
      
      <header class="unified-site-header" aria-label="Navegación de PORTFOLIO">
        <a class="unified-site-brand" href="./index.html"><img class="brand-otter" src="./assets/nutria-logo.png" alt="" aria-hidden="true" /><span class="brand-copy">NNYTRO <span class="brand-section">/ PORTFOLIO</span></span></a>
        <nav class="unified-site-nav" aria-label="Otras páginas">

          <a href="./musica.html">Música</a>

      <h1 class="gallery-title gallery-page-title">Portfolio</h1>

      <section class="gallery-toolbar" aria-label="Filtros del portfolio">

        <div class="gallery-filters" id="gallery-filters"></div>
      </section>

        <div class="gallery-modal-media" id="gallery-modal-media"></div>
        <div class="gallery-modal-info">
          <p class="detail-kicker" id="gallery-modal-category">categoría</p>
          <h2 id="gallery-modal-title">Proyecto</h2>
          <p id="gallery-modal-description" class="gallery-modal-description" hidden></p>
          <p id="gallery-modal-type">imagen</p>
